name: NeyroRanks
version: '1.1'
main: net.neyrocraft.ranks.NeyroRanks
api-version: '26.3'
description: Unique NeyroCraft rank prefixes (chat, nameplates, tab list)
author: NeyroCraft
loadbefore: [NeyroTab, NeyroSpell]
commands:
  prefix:
    description: Префиксы NeyroCraft
    aliases: [префикс, prefixes, rank, ранг]
    usage: /prefix | set <ник> <префикс> | remove <ник> | create <id> <#цвет> <значок> <название> | delete <id> | reload
  fly:
    description: VIP flight toggle
  heal:
    description: PREMIUM heal
  kill:
    description: ELITE player kill, once per hour
  ban:
    description: TITAN one-hour player ban, once per day
permissions:
  neyroranks.admin:
    default: op
