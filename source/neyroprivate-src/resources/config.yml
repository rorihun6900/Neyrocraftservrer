# NeyroPrivate — приваты для выживания и Minecraft 1.0
# Миры, где работают приваты (хаб и мини-игры защищены самим сервером)
worlds:
  - world
  - world_nether
  - world_the_end
  - neyro_retro
# Сколько приватов может быть у одного игрока
max-regions: 3
# Максимальная площадь одного привата (100×100 = 10000)
max-area: 10000
# Минимальная сторона
min-size: 3
# Радиус для /rg auto (15 → приват 31×31)
auto-radius: 15
